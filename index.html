<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jacob Hixon's little corner of the internet.">
  <title>Jacob Hixon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="desktop">
    <header class="menu-bar">
      <div class="menu-left">
        <span class="apple"></span>
        <span>File</span>
        <span>Edit</span>
        <span>View</span>
        <span>Special</span>
      </div>
      <div class="menu-right" id="clock">--:--</div>
    </header>

    <main class="screen">
      <section class="welcome">
        <div class="welcome-title" aria-live="polite">
          <span id="typed"></span><span class="cursor"></span>
        </div>
      </section>

      <section class="window-grid" id="links">
        <div class="mac-window">
          <div class="titlebar">
            <button class="close" aria-label="Close">×</button>
            <span>Quick Links</span>
            <span class="title-spacer"></span>
          </div>
          <div class="window-content">
            <a href="https://www.linkedin.com/in/jacob-hixon/" target="_blank" rel="noopener">
              <span class="icon">↗</span> LinkedIn
            </a>
            <a href="https://github.com/JacobHixon698" target="_blank" rel="noopener">
              <span class="icon">⌘</span> GitHub
            </a>
          </div>
        </div>

        <div class="mac-window">
          <div class="titlebar">
            <button class="close" aria-label="Close">×</button>
            <span>Servers</span>
            <span class="title-spacer"></span>
          </div>
          <div class="window-content">
            <a href="https://proxmox.hixon.me/">
              <span class="icon">▣</span> Proxmox
            </a>
            <a href="https://actual.hixon.me/">
              <span class="icon">$</span> Actual
            </a>
          </div>
        </div>
      </section>

      <p class="footer" id="footer">hixon.me · 2026</p>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
